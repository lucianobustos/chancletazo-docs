    }
    .path-section h2 { font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; font-size: 14px; color: #93c5fd; }
    *,*::before,*::after { box-sizing: border-box; }
    body {
      margin: 0;

      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid #1e293b;
      position: sticky; top: 0; z-index: 10;

    h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.5px; }

      padding: 8px 12px; border-radius: 8px;
      background: #0f172a; border: 1px solid #334155;
      color: #e2e8f0; font: inherit;
    }
    .search:focus { outline: none; border-color: #60a5fa; }
    .group-toggle {
      display: inline-flex; gap: 0; border-radius: 8px; overflow: hidden;

      padding: 8px 14px; background: #0f172a; color: #94a3b8;

      transition: background 0.1s ease, color 0.1s ease;

    .group-toggle button.active { background: #1e40af; color: #fff; }
    .group-toggle button:hover:not(.active) { background: #1e293b; color: #e2e8f0; }

    nav { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .role-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      color: #fff; font-weight: 600; font-size: 12px;
      text-decoration: none; border: 0; cursor: pointer; font-family: inherit;
      transition: transform 0.1s ease, opacity 0.15s ease;
      opacity: 0.55;
    }
    .role-pill.active { opacity: 1; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .role-pill:hover { opacity: 1; }
    .role-pill .count {
      background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 999px;
      font-size: 10px; font-weight: 700;
    }
    .stats { color: #94a3b8; font-size: 11px; margin-left: auto; }

    main { padding: 20px; max-width: 1400px; margin: 0 auto; }

    .role-section { margin-top: 32px; scroll-margin-top: 120px; }
    .role-section h2 {
      font-size: 18px; margin: 0 0 12px;
      padding-bottom: 8px; border-bottom: 2px solid;
      display: flex; align-items: center; gap: 10px;
    }
    .role-emoji { font-size: 22px; }
    .role-count { margin-left: auto; font-size: 11px; color: #94a3b8; font-weight: 400; }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .card {
      margin: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #64748b; }
    .card a { display: block; line-height: 0; }
    .card img {
      width: 100%; height: 380px; object-fit: cover; object-position: top;
      background: #0f172a;
    }
    /* Sizing por viewport — a nivel CARD para soportar vista mixta (varios viewports a la vez). */
    .card.vp-tablet img  { height: 400px; }
    .card.vp-desktop img { height: 240px; }
    /* Ancho de columnas: con 1 viewport activo se ajusta a ese; en mixto, intermedio. */
    main.vp-tablet  .grid:not(.grid-video) { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    main.vp-desktop .grid:not(.grid-video) { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
    main.vp-multi   .grid:not(.grid-video) { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .vp-toggle button.active { background: #0e7490; color: #fff; }
    /* Glifo de checkbox: refleja marcado/desmarcado. */
    .vp-toggle .cb::before { content: '☐'; margin-right: 5px; }
    .vp-toggle button.active .cb::before { content: '☑'; }
    .vp-badge { font-size: 11px; opacity: 0.85; }
    .grid-video { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .video-card video {
      width: 100%; max-height: 460px; display: block;
      background: #000; line-height: 0;
    }
    figcaption {
      padding: 8px 10px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px;
    }
    figcaption code {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      color: #93c5fd;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 70%;
    }
    .meta { color: #64748b; font-size: 10px; }

    .empty {
      padding: 60px 20px; text-align: center; color: #94a3b8;
      border: 2px dashed #334155; border-radius: 12px;
    }
  </style>

      }
    }

    function filteredVideos() {
      const q = state.query.trim().toLowerCase();
      return VIDEOS.filter((v) => state.activeRoles.has(v.role) && (!q || v.role.toLowerCase().includes(q) || v.user.toLowerCase().includes(q)));
    }

    function videoCardHtml(v) {
      const meta = ROLE_META[v.role] || { label: v.role, color: '#475569', emoji: '•' };
      return `<figure class="card video-card">
        <video controls preload="metadata" playsinline src="${esc(VIDEO_PREFIX + v.file)}"></video>
        <figcaption>
          <span class="role-badge" style="background:${meta.color}">${meta.emoji} ${meta.label}</span>
          <span class="meta">${esc(v.user)} · ${(v.size/1048576).toFixed(1)} MB</span>
        </figcaption>
      </figure>`;
    }

    function render() {
      const main = document.getElementById('main');
      const stats = document.getElementById('stats');

      main.classList.remove('vp-mobile', 'vp-tablet', 'vp-desktop', 'vp-multi');
      main.classList.add(state.viewports.size === 1 ? 'vp-' + [...state.viewports][0] : 'vp-multi');
      updateRoleCounts();

      if (state.groupBy === 'video') {
        const vids = filteredVideos();
        stats.textContent = `${vids.length} / ${VIDEOS.length} videos`;
        if (!vids.length) {
          main.innerHTML = '<div class="empty">Ningún video matchea el filtro actual.</div>';
          return;
        }
        const byRole = {};
        for (const v of vids) (byRole[v.role] ||= []).push(v);
        main.innerHTML = ROLE_ORDER.filter((r) => byRole[r]?.length).map((r) => {
          const meta = ROLE_META[r] || { label: r, color: '#475569', emoji: '•' };
          const cards = byRole[r].map((v) => videoCardHtml(v)).join('');
          return `<section id="vrole-${r}" class="role-section">
            <h2 style="border-color:${meta.color}">
              <span class="role-emoji">${meta.emoji}</span>
              ${meta.label}
              <span class="role-count">${byRole[r].length} video(s)</span>
            </h2>
            <div class="grid grid-video">${cards}</div>
          </section>`;
        }).join('');
        return;
      }

      const data = filtered();
      const vpTotal = SHOTS.filter((s) => state.viewports.has(s.viewport)).length;
      const vpList = AVAILABLE_VIEWPORTS.filter((v) => state.viewports.has(v)).join(', ');
      stats.textContent = `${data.length} / ${vpTotal} capturas · ${vpList}`;

      if (!data.length) {
        main.innerHTML = '<div class="empty">Nada matchea el filtro actual.</div>';
        return;
      }

      if (state.groupBy === 'role') {
        const byRole = {};
        for (const s of data) (byRole[s.role] ||= []).push(s);
        const html = ROLE_ORDER.filter((r) => byRole[r]?.length).map((r) => {
          const meta = ROLE_META[r] || { label: r, color: '#475569', emoji: '•' };
          const cards = byRole[r]
            .sort((a, b) => a.slug.localeCompare(b.slug) || AVAILABLE_VIEWPORTS.indexOf(a.viewport) - AVAILABLE_VIEWPORTS.indexOf(b.viewport))
            .map((s) => cardHtml(s)).join('');
          return `<section id="role-${r}" class="role-section">
            <h2 style="border-color:${meta.color}">
              <span class="role-emoji">${meta.emoji}</span>
              ${meta.label}
              <span class="role-count">${byRole[r].length} pantallas</span>
            </h2>
            <div class="grid">${cards}</div>
          </section>`;
        }).join('');
        main.innerHTML = html;
      } else {
        const bySlug = {};
        for (const s of data) (bySlug[s.slug] ||= []).push(s);
        const slugs = Object.keys(bySlug).sort();
        const html = slugs.map((slug) => {
          const cards = bySlug[slug]
            .sort((a, b) => (ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role)) || (AVAILABLE_VIEWPORTS.indexOf(a.viewport) - AVAILABLE_VIEWPORTS.indexOf(b.viewport)))
            .map((s) => cardHtml(s, { showRole: true })).join('');
          return `<section class="role-section path-section">
            <h2 style="border-color:#334155">
              ${esc(humanizeSlug(slug))}
              <span class="role-count">${bySlug[slug].length} capturas</span>
            </h2>
            <div class="grid">${cards}</div>
          </section>`;
        }).join('');
        main.innerHTML = html;
      }
    }

    // Wire up: search
    document.getElementById('search').addEventListener('input', (e) => {
      state.query = e.target.value;
      render();
    });

    // Wire up: role pills (click to toggle filter)
    for (const pill of document.querySelectorAll('[data-role-filter]')) {
      pill.classList.add('active');
      pill.addEventListener('click', (e) => {
        const r = e.currentTarget.dataset.roleFilter;
        const allActive = state.activeRoles.size === ROLE_ORDER.length;
        // Click en pill activo cuando todo está activo → solo ese rol (modo "solo this").
        // Click cuando ya hay filtro → toggle.
        if (allActive) {
          state.activeRoles = new Set([r]);
        } else if (state.activeRoles.has(r) && state.activeRoles.size === 1) {
          state.activeRoles = new Set(ROLE_ORDER); // volver a todos
        } else if (state.activeRoles.has(r)) {
          state.activeRoles.delete(r);
        } else {
          state.activeRoles.add(r);
        }
        for (const p of document.querySelectorAll('[data-role-filter]')) {
          p.classList.toggle('active', state.activeRoles.has(p.dataset.roleFilter));
        }
        render();
      });
    }

    // Wire up: viewport checkboxes (multi-select — 1, 2 o 3 a la vez; nunca 0).
    for (const btn of document.querySelectorAll('[data-viewport]')) {
      btn.addEventListener('click', (e) => {
        const v = e.currentTarget.dataset.viewport;
        if (state.viewports.has(v)) {
          if (state.viewports.size === 1) return; // no permitir desmarcar el último
          state.viewports.delete(v);
        } else {
          state.viewports.add(v);
        }
        e.currentTarget.classList.toggle('active', state.viewports.has(v));
        render();
      });
    }

    // Wire up: group toggle
    for (const btn of document.querySelectorAll('[data-group]')) {
      btn.addEventListener('click', (e) => {
        state.groupBy = e.currentTarget.dataset.group;
        for (const b of document.querySelectorAll('[data-group]')) {
          b.classList.toggle('active', b.dataset.group === state.groupBy);
        }
        render();
      });
    }

    render();
  </script>
</body>
</html>
